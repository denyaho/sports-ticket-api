name: Lint Workflows

on:
  push:
    paths:
      - '**.go'
      - 'go.sum'
      - 'go.mod'
      - '.golangci.yml'
      - '.github/workflows/lint_workflows.yml'


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Lint Code
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
